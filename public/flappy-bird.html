<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird JS - Retro Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #ffffff;
      padding: 16px;
    }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 4px #334155;
      border-radius: 16px;
      overflow: hidden;
      background: #70c5ce;
    }

    canvas {
      display: block;
      cursor: pointer;
      touch-action: manipulation;
    }

    .controls-hint {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kbd-key {
      background: #1e293b;
      border: 1px solid #475569;
      border-bottom: 3px solid #334155;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #f1f5f9;
    }

    .audio-toggle {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.15s;
      outline: none;
    }

    .audio-toggle:hover {
      background: rgba(15, 23, 42, 0.85);
    }

    .face-toggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      height: 38px;
      padding: 0 12px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background 0.15s, transform 0.1s;
      outline: none;
    }

    .face-toggle:hover {
      background: rgba(15, 23, 42, 0.85);
      transform: scale(1.03);
    }

    .bright-toggle {
      position: absolute;
      top: 12px;
      left: 142px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fef08a;
      height: 38px;
      padding: 0 10px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background 0.15s, transform 0.1s;
      outline: none;
    }

    .bright-toggle:hover {
      background: rgba(15, 23, 42, 0.85);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <button id="faceToggle" class="face-toggle" title="Change / Upload Custom Face">👤 <span>Photo Face</span></button>
    <button id="brightToggle" class="bright-toggle" title="Toggle Brightness (High / Ultra / Normal)">☀️ <span>1.35x</span></button>
    <input type="file" id="faceInput" accept="image/*" style="display: none;" />
    <button id="soundToggle" class="audio-toggle" title="Toggle Sound">🔊</button>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>

  <div class="controls-hint">
    <span>Controls:</span>
    <span class="kbd-key">SPACE</span>
    <span class="kbd-key">CLICK</span>
    <span class="kbd-key">TAP</span>
  </div>

  <script>
    // --- Retro Web Audio Synthesizer ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playFlap() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (e) {}
      }

      playScore() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.08); // A5
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.setValueAtTime(0.25, now + 0.08);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } catch (e) {}
      }

      playHit() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } catch (e) {}
      }

      playDie() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.35);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch (e) {}
      }
    }

    const sound = new SoundEngine();
    const soundToggle = document.getElementById('soundToggle');
    soundToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.enabled = !sound.enabled;
      soundToggle.textContent = sound.enabled ? '🔊' : '🔇';
    });

    // Custom Face Photo Image
    const customFaceImg = new Image();
    customFaceImg.src = '/cake_face_player.jpg';

    let faceBrightness = 1.35;
    const brightToggle = document.getElementById('brightToggle');
    brightToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      faceBrightness = faceBrightness === 1.35 ? 1.6 : faceBrightness === 1.6 ? 1.0 : 1.35;
      brightToggle.querySelector('span').textContent = faceBrightness + 'x';
    });

    const faceToggle = document.getElementById('faceToggle');
    const faceInput = document.getElementById('faceInput');
    faceToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      faceInput.click();
    });

    faceInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          if (event.target && event.target.result) {
            customFaceImg.src = event.target.result;
          }
        };
        reader.readAsDataURL(file);
      }
    });

    // --- Game Engine ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const WIDTH = 400;
    const HEIGHT = 600;
    const GROUND_HEIGHT = 90;
    const PLAY_HEIGHT = HEIGHT - GROUND_HEIGHT;

    // HiDPI crisp canvas
    const dpr = window.devicePixelRatio || 1;
    canvas.width = WIDTH * dpr;
    canvas.height = HEIGHT * dpr;
    canvas.style.width = WIDTH + 'px';
    canvas.style.height = HEIGHT + 'px';
    ctx.scale(dpr, dpr);

    const STORAGE_KEY = 'flappy_bird_high_score';
    let highScore = 0;
    try {
      highScore = parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0;
    } catch (err) {
      highScore = 0;
    }

    const STATE_START = 0;
    const STATE_PLAYING = 1;
    const STATE_GAMEOVER = 2;
    let gameState = STATE_START;

    let score = 0;
    let frames = 0;
    let groundScroll = 0;
    let shakeTimer = 0;

    const particles = [];

    function addFeatherParticles(x, y, count = 4) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 3,
          vy: Math.random() * 2 + 1,
          size: Math.random() * 3 + 2,
          color: Math.random() > 0.5 ? '#fef08a' : '#f59e0b',
          alpha: 1,
          decay: 0.02 + Math.random() * 0.02,
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.1
        });
      }
    }

    function addExplosionParticles(x, y) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 4 + 2,
          color: ['#ef4444', '#f59e0b', '#fbbf24', '#ffffff'][Math.floor(Math.random() * 4)],
          alpha: 1,
          decay: 0.03 + Math.random() * 0.02,
          rotation: 0,
          vRot: 0
        });
      }
    }

    function addCreamParticles(x, y) {
      const colors = ['#ffffff', '#ffffff', '#fef08a', '#fde047', '#fbcfe8', '#38bdf8'];
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.7) * 3.5,
          vy: Math.random() * 2 + 0.5,
          size: Math.random() * 3.5 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: 0.03 + Math.random() * 0.02,
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.15
        });
      }
    }

    // --- Bird ---
    const bird = {
      x: 85,
      y: 250,
      radius: 15,
      velocity: 0,
      gravity: 0.38,
      jumpImpulse: -7.2,
      rotation: 0,
      wingTimer: 0,

      reset() {
        this.x = 85;
        this.y = 250;
        this.velocity = 0;
        this.rotation = 0;
        this.wingTimer = 0;
      },

      flap() {
        this.velocity = this.jumpImpulse;
        this.wingTimer = 10;
        sound.playFlap();
        if (customFaceImg.complete && customFaceImg.naturalWidth > 0) {
          addCreamParticles(this.x - 12, this.y + 2);
        } else {
          addFeatherParticles(this.x - 12, this.y + 4, 3);
        }
      },

      update() {
        if (gameState === STATE_START) {
          this.y = 240 + Math.sin(frames * 0.08) * 8;
          this.rotation = 0;
          this.wingTimer = (frames % 20 < 10) ? 1 : 0;
          return;
        }

        this.velocity += this.gravity;
        if (this.velocity > 9) this.velocity = 9;
        this.y += this.velocity;

        if (this.velocity < 0) {
          this.rotation = Math.max(-0.45, this.velocity * 0.07);
        } else {
          this.rotation = Math.min(Math.PI / 2.2, (this.velocity - 2) * 0.12);
        }

        if (this.wingTimer > 0) this.wingTimer--;
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const isFlapping = this.wingTimer > 0 || (gameState === STATE_START && frames % 14 < 7);

        // If photo face is loaded, render pure face avatar (Specially removed all bird wings, beak, tail)
        if (customFaceImg.complete && customFaceImg.naturalWidth > 0) {
          const faceR = 19;

          // Glowing backdrop for high-brightness pop
          ctx.save();
          ctx.shadowColor = 'rgba(255, 255, 255, 0.95)';
          ctx.shadowBlur = 12;

          // Circular Clipped Face Avatar with High Brightness filter
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, faceR, 0, Math.PI * 2);
          ctx.clip();

          // High Brightness filter on canvas
          ctx.filter = `brightness(${faceBrightness}) contrast(1.1) saturate(1.15)`;
          ctx.drawImage(customFaceImg, -faceR, -faceR, faceR * 2, faceR * 2);
          ctx.restore();

          // Outer crisp White and Golden rings (Clean character frame without bird parts)
          ctx.beginPath();
          ctx.arc(0, 0, faceR, 0, Math.PI * 2);
          ctx.lineWidth = 2.8;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, faceR + 1.8, 0, Math.PI * 2);
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = '#f59e0b';
          ctx.stroke();

          // Glossy highlight reflection
          ctx.beginPath();
          ctx.arc(-2, -2, faceR - 2.5, Math.PI * 1.05, Math.PI * 1.65);
          ctx.lineWidth = 2;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.stroke();

          ctx.restore();
          ctx.restore();
          return;
        }

        // Tail Feathers
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(-21, -6);
        ctx.lineTo(-19, 4);
        ctx.closePath();
        ctx.fill();

        // Body
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#78350f';
        ctx.stroke();

        // Belly
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.ellipse(-2, 3, 10, 7, 0, 0, Math.PI);
        ctx.fill();

        // Wing
        ctx.save();
        ctx.translate(-4, 0);
        ctx.rotate(isFlapping ? -0.4 : 0.2);
        ctx.fillStyle = '#fbbf24';
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(0, 0, 8, 5, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Eye
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(8, -4, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Pupil
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(10, -4, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Pupil Gleam
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(9.5, -5.5, 1, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#ea580c';
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(11, -2);
        ctx.lineTo(21, 2);
        ctx.lineTo(11, 6);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(11, 2);
        ctx.lineTo(19, 2);
        ctx.stroke();

        ctx.restore();
      }
    };

    // --- Pipes ---
    class PipePair {
      constructor(x) {
        this.x = x;
        this.width = 62;
        this.gap = 135;
        this.passed = false;

        const minTop = 50;
        const maxTop = PLAY_HEIGHT - this.gap - 50;
        this.topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
        this.bottomY = this.topHeight + this.gap;
        this.bottomHeight = PLAY_HEIGHT - this.bottomY;
      }

      update(speed) {
        this.x -= speed;
      }

      draw() {
        const lipHeight = 24;
        const lipOverhang = 3;

        drawPipeCylinder(this.x, 0, this.width, this.topHeight - lipHeight);
        drawPipeCap(this.x - lipOverhang, this.topHeight - lipHeight, this.width + lipOverhang * 2, lipHeight);
        drawPipeCap(this.x - lipOverhang, this.bottomY, this.width + lipOverhang * 2, lipHeight);
        drawPipeCylinder(this.x, this.bottomY + lipHeight, this.width, this.bottomHeight - lipHeight);
      }
    }

    function drawPipeCylinder(x, y, w, h) {
      if (h <= 0) return;
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#15803d');
      grad.addColorStop(0.2, '#22c55e');
      grad.addColorStop(0.5, '#4ade80');
      grad.addColorStop(0.8, '#16a34a');
      grad.addColorStop(1, '#14532d');

      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(x + 6, y, 4, h);
    }

    function drawPipeCap(x, y, w, h) {
      const grad = ctx.createLinearGradient(x, 0, x + w, 0);
      grad.addColorStop(0, '#15803d');
      grad.addColorStop(0.25, '#22c55e');
      grad.addColorStop(0.55, '#86efac');
      grad.addColorStop(0.85, '#16a34a');
      grad.addColorStop(1, '#052e16');

      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#052e16';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(x + 7, y + 2, 4, h - 4);
    }

    let pipes = [];
    const PIPE_SPEED = 2.4;
    const SPAWN_INTERVAL = 110;

    function resetGame() {
      bird.reset();
      pipes = [];
      score = 0;
      frames = 0;
      particles.length = 0;
      shakeTimer = 0;
      gameState = STATE_PLAYING;
      bird.flap();
    }

    function triggerGameOver() {
      if (gameState === STATE_GAMEOVER) return;
      gameState = STATE_GAMEOVER;
      shakeTimer = 14;
      sound.playHit();
      sound.playDie();
      addExplosionParticles(bird.x, bird.y);

      if (score > highScore) {
        highScore = score;
        try {
          localStorage.setItem(STORAGE_KEY, highScore.toString());
        } catch (e) {}
      }
    }

    // --- Background Graphics ---
    const clouds = [
      { x: 40, y: 80, s: 0.9, sp: 0.4 },
      { x: 190, y: 140, s: 0.7, sp: 0.3 },
      { x: 320, y: 60, s: 1.1, sp: 0.45 },
    ];

    function drawCloud(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.arc(16, -6, 22, 0, Math.PI * 2);
      ctx.arc(36, 0, 18, 0, Math.PI * 2);
      ctx.arc(20, 10, 16, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawSkyline() {
      const baseY = PLAY_HEIGHT;
      ctx.fillStyle = '#60a5fa';
      ctx.globalAlpha = 0.35;

      const buildings = [
        { x: 10, w: 36, h: 70 },
        { x: 55, w: 42, h: 105 },
        { x: 105, w: 30, h: 50 },
        { x: 145, w: 48, h: 90 },
        { x: 200, w: 36, h: 65 },
        { x: 245, w: 44, h: 115 },
        { x: 298, w: 38, h: 80 },
        { x: 345, w: 46, h: 95 }
      ];

      buildings.forEach(b => {
        ctx.fillRect(b.x, baseY - b.h, b.w, b.h);
        ctx.fillStyle = '#bfdbfe';
        for (let wy = baseY - b.h + 8; wy < baseY - 10; wy += 14) {
          for (let wx = b.x + 6; wx < b.x + b.w - 8; wx += 10) {
            ctx.fillRect(wx, wy, 4, 6);
          }
        }
        ctx.fillStyle = '#60a5fa';
      });

      ctx.globalAlpha = 1.0;
    }

    function drawGround() {
      const y = PLAY_HEIGHT;
      const dirtGrad = ctx.createLinearGradient(0, y, 0, HEIGHT);
      dirtGrad.addColorStop(0, '#eab308');
      dirtGrad.addColorStop(0.15, '#ca8a04');
      dirtGrad.addColorStop(1, '#a16207');
      ctx.fillStyle = dirtGrad;
      ctx.fillRect(0, y, WIDTH, GROUND_HEIGHT);

      const grassGrad = ctx.createLinearGradient(0, y, 0, y + 14);
      grassGrad.addColorStop(0, '#4ade80');
      grassGrad.addColorStop(1, '#16a34a');
      ctx.fillStyle = grassGrad;
      ctx.fillRect(0, y, WIDTH, 14);

      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, y + 13, WIDTH, 2);

      ctx.fillStyle = '#22c55e';
      const stripeW = 20;
      const offset = groundScroll % stripeW;
      for (let x = -stripeW; x < WIDTH + stripeW; x += stripeW) {
        ctx.beginPath();
        ctx.moveTo(x - offset, y + 14);
        ctx.lineTo(x - offset + 8, y + 20);
        ctx.lineTo(x - offset + 12, y + 14);
        ctx.closePath();
        ctx.fill();
      }

      ctx.strokeStyle = '#854d0e';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, y + 36);
      ctx.lineTo(WIDTH, y + 36);
      ctx.moveTo(0, y + 58);
      ctx.lineTo(WIDTH, y + 58);
      ctx.stroke();

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(WIDTH, y);
      ctx.stroke();
    }

    function drawScoreBadge(s, x, y) {
      ctx.save();
      ctx.font = '900 42px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#0f172a';
      ctx.strokeText(s, x, y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(s, x, y);
      ctx.restore();
    }

    function drawStartScreen() {
      ctx.save();
      ctx.textAlign = 'center';

      ctx.font = '900 36px sans-serif';
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#78350f';
      ctx.strokeText('FLAPPY BIRD', WIDTH / 2, 130);
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('FLAPPY BIRD', WIDTH / 2, 130);

      ctx.font = '800 16px sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0f172a';
      ctx.strokeText('RETRO JS EDITION', WIDTH / 2, 165);
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('RETRO JS EDITION', WIDTH / 2, 165);

      const boxY = 320;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
      roundRect(ctx, 40, boxY, WIDTH - 80, 105, 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();

      const alpha = 0.6 + Math.sin(frames * 0.1) * 0.4;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fde047';
      ctx.font = '800 17px sans-serif';
      ctx.fillText('PRESS SPACE OR TAP', WIDTH / 2, boxY + 40);

      ctx.globalAlpha = 1;
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '600 13px sans-serif';
      ctx.fillText('Jump through the pipes to score!', WIDTH / 2, boxY + 74);

      if (highScore > 0) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 13px sans-serif';
        ctx.fillText(`🏆 BEST SCORE: ${highScore}`, WIDTH / 2, 455);
      }

      ctx.restore();
    }

    function drawGameOverScreen() {
      ctx.save();
      ctx.textAlign = 'center';

      ctx.font = '900 36px sans-serif';
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#450a0a';
      ctx.strokeText('GAME OVER', WIDTH / 2, 125);
      ctx.fillStyle = '#ef4444';
      ctx.fillText('GAME OVER', WIDTH / 2, 125);

      const cardX = 45;
      const cardY = 165;
      const cardW = WIDTH - 90;
      const cardH = 175;

      ctx.fillStyle = '#fef3c7';
      roundRect(ctx, cardX, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#b45309';
      ctx.stroke();

      ctx.fillStyle = '#fde68a';
      roundRect(ctx, cardX + 10, cardY + 10, cardW - 20, cardH - 20, 10);
      ctx.fill();

      const medalBoxX = cardX + 24;
      const medalBoxY = cardY + 36;
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      roundRect(ctx, medalBoxX, medalBoxY, 70, 80, 8);
      ctx.fill();

      ctx.font = '700 11px sans-serif';
      ctx.fillStyle = '#78350f';
      ctx.fillText('MEDAL', medalBoxX + 35, medalBoxY + 16);
      drawMedal(medalBoxX + 35, medalBoxY + 48, score);

      const labelX = cardX + cardW - 35;
      ctx.font = '800 13px sans-serif';
      ctx.fillStyle = '#b45309';
      ctx.textAlign = 'right';
      ctx.fillText('SCORE', labelX, cardY + 42);

      ctx.font = '900 28px sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText(score.toString(), labelX, cardY + 72);

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cardX + 110, cardY + 86);
      ctx.lineTo(labelX, cardY + 86);
      ctx.stroke();

      ctx.font = '800 13px sans-serif';
      ctx.fillStyle = '#b45309';
      ctx.fillText('BEST', labelX, cardY + 110);

      ctx.font = '900 28px sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText(highScore.toString(), labelX, cardY + 140);

      if (score > 0 && score >= highScore) {
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 11px sans-serif';
        ctx.fillText('✨ NEW RECORD!', labelX, cardY + 160);
      }

      drawRestartButton(WIDTH / 2, 385);
      ctx.restore();
    }

    const restartBtn = {
      x: WIDTH / 2 - 95,
      y: 365,
      w: 190,
      h: 52
    };

    function drawRestartButton(cx, cy) {
      const bx = cx - 95;
      const by = cy - 26;

      ctx.save();
      ctx.fillStyle = '#78350f';
      roundRect(ctx, bx, by + 4, 190, 52, 12);
      ctx.fill();

      const grad = ctx.createLinearGradient(0, by, 0, by + 52);
      grad.addColorStop(0, '#f59e0b');
      grad.addColorStop(1, '#d97706');
      ctx.fillStyle = grad;
      roundRect(ctx, bx, by, 190, 52, 12);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '900 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 4;
      ctx.fillText('PLAY AGAIN', cx, cy);
      ctx.restore();
    }

    function drawMedal(cx, cy, finalScore) {
      ctx.save();
      let color = null;
      if (finalScore >= 40) color = '#38bdf8'; // Platinum
      else if (finalScore >= 25) color = '#fbbf24'; // Gold
      else if (finalScore >= 10) color = '#cbd5e1'; // Silver
      else if (finalScore >= 3) color = '#d97706'; // Bronze

      if (color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cx, cy, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#78350f';
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', cx, cy + 1);
      } else {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('—', cx, cy);
      }
      ctx.restore();
    }

    function roundRect(c, x, y, width, height, radius) {
      c.beginPath();
      c.moveTo(x + radius, y);
      c.lineTo(x + width - radius, y);
      c.quadraticCurveTo(x + width, y, x + width, y + radius);
      c.lineTo(x + width, y + height - radius);
      c.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      c.lineTo(x + radius, y + height);
      c.quadraticCurveTo(x, y + height, x, y + height - radius);
      c.lineTo(x, y + radius);
      c.quadraticCurveTo(x, y, x + radius, y);
      c.closePath();
    }

    // --- Main Loop ---
    function update() {
      frames++;
      if (shakeTimer > 0) shakeTimer--;

      clouds.forEach(c => {
        c.x -= c.sp;
        if (c.x < -60) c.x = WIDTH + 60;
      });

      if (gameState !== STATE_GAMEOVER) {
        groundScroll += PIPE_SPEED;
      }

      bird.update();

      if (gameState === STATE_PLAYING) {
        if (frames % SPAWN_INTERVAL === 0) {
          pipes.push(new PipePair(WIDTH + 20));
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.update(PIPE_SPEED);

          if (!p.passed && p.x + p.width < bird.x - bird.radius) {
            p.passed = true;
            score++;
            sound.playScore();
          }

          const bx = bird.x - bird.radius + 3;
          const by = bird.y - bird.radius + 3;
          const bw = (bird.radius * 2) - 6;
          const bh = (bird.radius * 2) - 6;

          if (bx < p.x + p.width && bx + bw > p.x && by < p.topHeight) {
            triggerGameOver();
            break;
          }

          if (bx < p.x + p.width && bx + bw > p.x && by + bh > p.bottomY) {
            triggerGameOver();
            break;
          }

          if (p.x + p.width < -30) {
            pipes.splice(i, 1);
          }
        }

        if (bird.y - bird.radius <= 0) {
          bird.y = bird.radius;
          bird.velocity = 0;
        }

        if (bird.y + bird.radius >= PLAY_HEIGHT) {
          bird.y = PLAY_HEIGHT - bird.radius;
          triggerGameOver();
        }
      } else if (gameState === STATE_GAMEOVER) {
        if (bird.y + bird.radius < PLAY_HEIGHT) {
          bird.y += bird.velocity;
          bird.velocity += bird.gravity * 1.2;
        } else {
          bird.y = PLAY_HEIGHT - bird.radius;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;
        pt.rotation += pt.vRot;
        if (pt.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.save();
      if (shakeTimer > 0) {
        const dx = (Math.random() - 0.5) * 8;
        const dy = (Math.random() - 0.5) * 8;
        ctx.translate(dx, dy);
      }

      const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAY_HEIGHT);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(0.7, '#7dd3fc');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      clouds.forEach(c => drawCloud(c.x, c.y, c.s));
      drawSkyline();
      pipes.forEach(p => p.draw());
      drawGround();

      particles.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.rotation);
        ctx.fillStyle = pt.color;
        ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
        ctx.restore();
      });

      bird.draw();

      if (gameState === STATE_START) {
        drawStartScreen();
      } else if (gameState === STATE_PLAYING) {
        drawScoreBadge(score, WIDTH / 2, 60);
      } else if (gameState === STATE_GAMEOVER) {
        drawGameOverScreen();
      }

      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function handleAction(clientX, clientY) {
      if (gameState === STATE_START) {
        resetGame();
      } else if (gameState === STATE_PLAYING) {
        bird.flap();
      } else if (gameState === STATE_GAMEOVER) {
        if (clientX !== undefined && clientY !== undefined) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = WIDTH / rect.width;
          const scaleY = HEIGHT / rect.height;
          const canvasX = (clientX - rect.left) * scaleX;
          const canvasY = (clientY - rect.top) * scaleY;

          if (
            canvasX >= restartBtn.x &&
            canvasX <= restartBtn.x + restartBtn.w &&
            canvasY >= restartBtn.y &&
            canvasY <= restartBtn.y + restartBtn.h
          ) {
            resetGame();
            return;
          }
        }
        if (frames > 20) {
          resetGame();
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleAction();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      handleAction(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches && e.touches.length > 0) {
        handleAction(e.touches[0].clientX, e.touches[0].clientY);
      } else {
        handleAction();
      }
    }, { passive: false });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
